<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAX aplicado a KPIs</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#ffffff;
    font-family:"Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding:50px 20px 70px;
  }
  .wrapper{
    max-width:1100px;
    margin:0 auto;
  }

  .root{
    background:#efece2;
    border:1.5px solid #8f8b7f;
    border-radius:10px;
    max-width:480px;
    margin:0 auto;
    padding:20px 30px;
    text-align:center;
    font-size:1.35rem;
    font-weight:700;
    color:#3a3a3a;
  }

  .branch{
    position:relative;
    height:60px;
    max-width:940px;
    margin:0 auto;
  }
  .branch svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
  }

  .columns{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:26px;
    max-width:1100px;
    margin:0 auto;
  }

  .card{
    border-radius:14px;
    padding:36px 26px;
    text-align:center;
  }
  .card h3{
    margin:0 0 18px;
    font-size:1.45rem;
  }
  .card p{
    margin:0 0 12px;
    font-size:1.1rem;
  }
  .card p.code{
    font-family:"Consolas","Courier New",monospace;
    font-size:1.05rem;
  }

  .card.green{ background:#d3f0e3; border:1.5px solid #1c8a63; }
  .card.green h3{ color:#0f5a3f; }
  .card.green p{ color:#1c8a63; }

  .card.purple{ background:#e6e5fb; border:1.5px solid #4a3fae; }
  .card.purple h3{ color:#2e2570; }
  .card.purple p{ color:#4a3fae; }

  .card.orange{ background:#faecd0; border:1.5px solid #b5791f; }
  .card.orange h3{ color:#7a4a12; }
  .card.orange p{ color:#b5791f; }

  @media (max-width:820px){
    .columns{ grid-template-columns:1fr; }
    .branch{ display:none; }
  }
</style>
</head>
<body>
<div class="wrapper">

  <div class="root">DAX aplicado a KPIs</div>

  <div class="branch">
    <svg viewBox="0 0 940 60" preserveAspectRatio="none">
      <line x1="470" y1="0" x2="470" y2="18" stroke="#9a9a9a" stroke-width="1.5"/>
      <line x1="160" y1="18" x2="780" y2="18" stroke="#9a9a9a" stroke-width="1.5"/>
      <line x1="160" y1="18" x2="160" y2="55" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#a1)"/>
      <line x1="470" y1="18" x2="470" y2="55" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#a2)"/>
      <line x1="780" y1="18" x2="780" y2="55" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#a3)"/>
      <defs>
        <marker id="a1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9a9a9a"/></marker>
        <marker id="a2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9a9a9a"/></marker>
        <marker id="a3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9a9a9a"/></marker>
      </defs>
    </svg>
  </div>

  <div class="columns">

    <div class="card green">
      <h3>Ventas totales</h3>
      <p>Función: SUM</p>
      <p class="code">=SUM(Ventas[Monto])</p>
      <p>Suma todas las ventas</p>
    </div>

    <div class="card purple">
      <h3>Margen de utilidad</h3>
      <p>Función: CALCULATE</p>
      <p class="code">=DIVIDE(Util, Ventas)</p>
      <p>Calcula % de margen</p>
    </div>

    <div class="card orange">
      <h3>Crecimiento interanual</h3>
      <p>Función: CALCULATE</p>
      <p class="code">SAMEPERIODLASTYEAR()</p>
      <p>Compara vs año anterior</p>
    </div>

  </div>

</div>
</body>
</html>
