<script>
  var scale = 1.0;
  var svg = document.getElementById('diagram');
  function applyZoom(){
    svg.setAttribute('width', 2560 * scale);
    svg.setAttribute('height', 1560 * scale);
  }
  function zoom(factor){
    scale = Math.min(4, Math.max(0.5, scale * factor));
    applyZoom();
  }
  function resetZoom(){
    scale = 1.0;
    applyZoom();
  }
  applyZoom();
</script>
