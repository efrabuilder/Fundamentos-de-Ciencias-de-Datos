<script>
  var scale = 1.6;
  var svg = document.getElementById('diagram');
  function applyZoom(){
    svg.setAttribute('width', 3070 * scale);
    svg.setAttribute('height', 900 * scale);
  }
  function zoom(factor){
    scale = Math.min(4, Math.max(0.5, scale * factor));
    applyZoom();
  }
  function resetZoom(){
    scale = 1.6;
    applyZoom();
  }
  applyZoom();
