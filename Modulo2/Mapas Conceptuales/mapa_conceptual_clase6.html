<script>
  var scale = 0.7;
  var svg = document.getElementById('diagram');
  function applyZoom(){
    svg.setAttribute('width', 7020 * scale);
    svg.setAttribute('height', 900 * scale);
  }
  function zoom(factor){
    scale = Math.min(4, Math.max(0.3, scale * factor));
    applyZoom();
  }
  function resetZoom(){
    scale = 0.7;
    applyZoom();
  }
  applyZoom();
</script>
